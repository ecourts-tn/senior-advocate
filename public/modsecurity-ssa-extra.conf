# Optional ModSecurity 2 custom rules for the SSA portal.
# Include from your Apache vhost or modsecurity.conf AFTER the OWASP CRS, e.g.:
#   Include /var/www/html/senior-advocate/public/modsecurity-ssa-extra.conf
#
# These close common CRS gaps noted in assessments:
#   - PHP short echo tags <?=
#   - PostgreSQL cast (::type) and concatenation (||) used in SQLi
#
# Tune anomaly scores to match your CRS version. IDs are in the custom 4000000 range.

SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS|ARGS|ARGS_NAMES|XML:/* \
    "@rx <\?=" \
    "id:4000001,phase:2,block,t:none,t:urlDecodeUni,t:htmlEntityDecode,msg:'SSA: PHP short echo tag <?= detected',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',tag:'attack-injection-php',tag:'ssa-custom',severity:attack=critical,setvar:'tx.php_injection_score=+%{tx.critical_anomaly_score}',setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|ARGS|ARGS_NAMES|XML:/* \
    "@rx <\?(?!xml)(?:php|=|[\s\r\n])" \
    "id:4000002,phase:2,block,t:none,t:urlDecodeUni,t:htmlEntityDecode,msg:'SSA: PHP open tag detected',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',tag:'attack-injection-php',tag:'ssa-custom',severity:attack=critical,setvar:'tx.php_injection_score=+%{tx.critical_anomaly_score}',setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_COOKIES|ARGS|ARGS_NAMES|XML:/* \
    "@rx ::\s*(?i:int|integer|bigint|smallint|text|varchar|character|char|bool|boolean|numeric|decimal|float|real|double|bytea|json|jsonb|name|oid|regclass|date|timestamp|uuid)" \
    "id:4000003,phase:2,block,t:none,t:urlDecodeUni,msg:'SSA: PostgreSQL cast operator ::type in input',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',tag:'attack-sqli',tag:'ssa-custom',severity:attack=critical,setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_COOKIES|ARGS|ARGS_NAMES|XML:/* \
    "@rx (?:['\"`]\s*\|\||\|\|\s*['\"`(]|\|\|\s*(?i:chr|char|encode|decode|cast|substring|pg_)\s*\()" \
    "id:4000004,phase:2,block,t:none,t:urlDecodeUni,msg:'SSA: PostgreSQL concatenation || used in injection context',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',tag:'attack-sqli',tag:'ssa-custom',severity:attack=critical,setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_COOKIES|ARGS|ARGS_NAMES|XML:/* \
    "@rx (?i)\b(?:pg_sleep|pg_read_file|pg_ls_dir|lo_import|lo_export)\s*\(" \
    "id:4000005,phase:2,block,t:none,t:urlDecodeUni,msg:'SSA: Dangerous PostgreSQL function in input',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',tag:'attack-sqli',tag:'ssa-custom',severity:attack=critical,setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
